[package]
name = "dbt-asdl"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
authors = ["Bo Lin <bo@dreamsphere.org>"]
description = "ASDL parser and code generator for SQL-like AST definitions."
license = "Apache-2.0"
repository = "https://github.com/sdf-labs/dbt-asdl"
readme = "README.md"
exclude = ["src/snapshots/", "tests/", "build.rs"]

[features]
default = ["loader"]
loader = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
ustr = "1.1.0"

[dev-dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
insta = "1.49.0"

[lints.rust]
missing_docs = "warn"
